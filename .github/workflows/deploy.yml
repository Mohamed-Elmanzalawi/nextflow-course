name: deploy-site

on:
  push:
    branches:
      - main
  workflow_dispatch:          # adds a "Run workflow" button in the Actions tab

# Least privilege: read the code, publish to Pages, prove the upload came from this repo.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.16"
      - run: pip install mkdocs-material==9.8.2
      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"   # hide Material's end-of-life banner in the log
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
