<figure class="nf-anim nf-anim--stage">
<svg viewBox="0 0 700 270" role="img" aria-labelledby="stageTitle">
<title id="stageTitle">Animation: Nextflow creates a task folder and links the 50 GB input into it instead of copying. The output is published to results as another link into work. When work is deleted, the results link breaks.</title>
<rect class="nfa-box" x="20" y="40" width="180" height="80" rx="10"/>
<text class="nfa-label" x="35" y="62">📁 data/</text>
<rect class="stage-file" x="35" y="78" width="150" height="26" rx="6"/>
<text class="stage-file-t" x="110" y="96" text-anchor="middle">sample.bam (50 GB)</text>
<g class="stage-task">
<rect class="nfa-box" x="250" y="40" width="200" height="160" rx="10"/>
<text class="nfa-label" x="265" y="62">📁 work/3f/a91c…/</text>
<g class="stage-entry-in"><rect class="stage-link-box" x="265" y="78" width="170" height="26" rx="6"/><text class="stage-file-t" x="350" y="96" text-anchor="middle">🔗 sample.bam</text></g>
<g class="stage-out"><rect class="stage-file" x="265" y="150" width="170" height="26" rx="6"/><text class="stage-file-t" x="350" y="168" text-anchor="middle">out.txt (new result)</text></g>
</g>
<g class="stage-task-ghost">
<rect class="stage-ghost" x="250" y="40" width="200" height="160" rx="10"/>
<text class="stage-deleted" x="350" y="125" text-anchor="middle">rm -rf work/  🗑️</text>
</g>
<path class="stage-link stage-link-in" d="M265 91 C230 91 230 91 185 91"/>
<g class="stage-results">
<rect class="nfa-box nfa-box--sum" x="500" y="120" width="180" height="80" rx="10"/>
<text class="nfa-label" x="515" y="142">📁 results/</text>
<rect class="stage-link-box" x="515" y="158" width="150" height="26" rx="6"/>
<text class="stage-file-t" x="590" y="176" text-anchor="middle">🔗 out.txt</text>
</g>
<path class="stage-link stage-link-out" d="M515 171 C480 171 470 163 435 163"/>
<path class="stage-link stage-link-broken" d="M515 171 C480 171 470 163 435 163"/>
<text class="stage-broken-label" x="590" y="222" text-anchor="middle">✗ broken link!</text>
<text class="nfa-step stage-l1" x="350" y="255" text-anchor="middle">① Each task gets its own folder; inputs are linked in (0 bytes copied)</text>
<text class="nfa-step stage-l2" x="350" y="255" text-anchor="middle">② The task writes its result inside its own folder</text>
<text class="nfa-step stage-l3" x="350" y="255" text-anchor="middle">③ publishDir (default mode) puts a link to it in results/</text>
<text class="nfa-step stage-l4" x="350" y="255" text-anchor="middle">④ Delete work/ and results/ points to nothing. Use mode: 'copy'!</text>
</svg>
<figcaption><strong>Symlinks in, symlinks out:</strong> staging by link is fast, but results published with the default mode depend on <code>work/</code> still existing. <em>(Hover to pause.)</em></figcaption>
</figure>
