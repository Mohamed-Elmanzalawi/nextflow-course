<figure class="nf-anim nf-anim--prof">
<svg viewBox="0 0 700 230" role="img" aria-labelledby="profTitle">
<title id="profTitle">Animation: the same process runs three ways. With no profile it fails because fastqc is not installed; with -profile docker it runs inside the container image; with -profile conda it runs inside a conda environment.</title>
<rect class="nfa-box" x="20" y="45" width="290" height="140" rx="10"/>
<text class="prof-code" x="32" y="70">process FASTQC {</text><text class="prof-code" x="52" y="90">container '…/fastqc:0.12.1'</text><text class="prof-code" x="52" y="110">conda 'bioconda::fastqc=0.12.1'</text><text class="prof-code" x="52" y="130">script: fastqc --version</text><text class="prof-code" x="32" y="150">}</text>
<g class="nfa-lines"><path d="M310 115 L400 115"/></g>
<text class="nfa-step prof-cmd prof-cmd1" x="20" y="30">$ nextflow run main.nf</text><g class="prof-out1"><rect class="prof-env prof-env--none" x="400" y="60" width="280" height="110" rx="10"/><text class="nfa-label" x="540" y="88" text-anchor="middle">your Mac (no environment)</text><text class="prof-term" x="540" y="118" text-anchor="middle">fastqc: command not found</text><text class="pipe-verdict pipe-bad" x="540" y="150" text-anchor="middle">exit 127 ✗</text></g><text class="nfa-step prof-l1" x="350" y="215" text-anchor="middle">Declared ≠ enabled: with no profile, the container and conda lines are ignored</text><g class="nfa-token prof-dot1"><circle class="nfa-dot" cx="310" cy="115" r="7"/></g><text class="nfa-step prof-cmd prof-cmd2" x="20" y="30">$ nextflow run main.nf -profile docker</text><g class="prof-out2"><rect class="prof-env prof-env--docker" x="400" y="60" width="280" height="110" rx="10"/><text class="nfa-label" x="540" y="84" text-anchor="middle">🐳 Docker container</text><rect class="stage-file" x="430" y="98" width="220" height="30" rx="6"/><text class="prof-term" x="540" y="118" text-anchor="middle">FastQC v0.12.1</text><text class="pipe-verdict pipe-ok" x="540" y="155" text-anchor="middle">✓ from the image</text></g><text class="nfa-step prof-l2" x="350" y="215" text-anchor="middle">docker.enabled = true → the task runs inside the declared image</text><g class="nfa-token prof-dot2"><circle class="nfa-dot" cx="310" cy="115" r="7"/></g><text class="nfa-step prof-cmd prof-cmd3" x="20" y="30">$ nextflow run main.nf -profile conda</text><g class="prof-out3"><rect class="prof-env prof-env--conda" x="400" y="60" width="280" height="110" rx="10"/><text class="nfa-label" x="540" y="84" text-anchor="middle">🐍 conda env (fastqc=0.12.1)</text><rect class="stage-file" x="430" y="98" width="220" height="30" rx="6"/><text class="prof-term" x="540" y="118" text-anchor="middle">FastQC v0.12.1</text><text class="pipe-verdict pipe-ok" x="540" y="155" text-anchor="middle">✓ built once, reused</text></g><text class="nfa-step prof-l3" x="350" y="215" text-anchor="middle">conda.enabled = true → Nextflow builds the declared env, then runs the task in it</text><g class="nfa-token prof-dot3"><circle class="nfa-dot" cx="310" cy="115" r="7"/></g>
</svg>
<figcaption><strong>The process declares, the profile decides:</strong> one <code>main.nf</code>, three outcomes, depending only on <code>-profile</code>. <em>(Hover to pause.)</em></figcaption>
</figure>
